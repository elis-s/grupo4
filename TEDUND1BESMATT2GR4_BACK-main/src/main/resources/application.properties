spring.application.name=clinica-backend

# =====================================================================
# Clinica Medica Academica - Back-End (Java + Spring)
#
# Senhas e segredos NAO ficam no codigo-fonte (secoes 4.3 e 6.5): vem de
# variaveis de ambiente. Para rodar no Eclipse, os valores ficam no arquivo
# local.properties, na raiz do projeto, que esta no .gitignore e nao vai
# para o GitHub (modelo: local.properties.exemplo).
# =====================================================================
spring.config.import=optional:file:./local.properties

# ---------------------------------------------------------------------
# Servidor (secao 6.4): o Back-End nao tem porta publica. Localmente atende
# so a propria maquina; no Docker fica na rede interna, atras do proxy do Front-End.
# ---------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never

# ---------------------------------------------------------------------
# Banco de dados (secoes 4.3 e 6.5)
# A aplicacao conecta com um usuario exclusivo e restrito (RNF018): sem DDL,
# sem DELETE e sem alterar a auditoria. Pool de conexoes: HikariCP.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica}
spring.datasource.username=${DB_APP_USER:clinica_app}
spring.datasource.password=${DB_APP_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

# Flyway: versiona o esquema e roda com o usuario dono do banco. A migracao V4
# cria o usuario da aplicacao com a senha DB_APP_PASSWORD (placeholders abaixo).
# Em producao, use FLYWAY_LOCATIONS=classpath:db/migration (sem os dados de teste).
spring.flyway.enabled=true
spring.flyway.user=${DB_OWNER_USER:postgres}
spring.flyway.password=${DB_OWNER_PASSWORD}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/testData}
spring.flyway.placeholders.app_db_user=${DB_APP_USER:clinica_app}
spring.flyway.placeholders.app_db_password=${DB_APP_PASSWORD}

# O esquema e do Flyway: o Hibernate so confere se as entidades batem com as tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Seguranca (secao 6)
# ---------------------------------------------------------------------
# Chave de assinatura do JWT (HMAC-SHA256, minimo 32 caracteres)
app.jwt.segredo=${JWT_SECRET}
# Validade curta do token (secao 6.1); renovacao em POST /api/auth/renovar
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:30}
app.jwt.emissor=clinica-backend

# Origem do Front-End (CORS restrito - secao 6.4)
app.frontend.url=${FRONTEND_URL:https://localhost}

# Chave de origem X-Frontend-Key: colocada pelo proxy do Front-End em toda requisicao (RNF015)
app.frontend.chave=${FRONTEND_KEY}
app.frontend.exigir-chave=true

logging.level.br.ucsal.clinica=INFO
